title: Esmail Shabayek
description: Engineering leader with 8+ years building and scaling SaaS platforms across backend, web, and mobile. Laravel, Node.js, Python, AWS and GCP.
url: https://shabayek.pages.dev
baseurl: ""
lang: en
author: Esmail Shabayek

permalink: /blog/:title/
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

social:
  name: Esmail Shabayek
  links:
    - https://www.linkedin.com/in/shabayekdes/
    - https://github.com/shabayekdes

# Social preview for any page without its own image; cards and post covers skip it.
og_image: /images/og-card.jpg

defaults:
  - scope:
      path: ""
    values:
      image: /images/og-card.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - design

# Cloudflare Pages reads _headers from the output root; Jekyll skips _files unless listed here
include:
  - _headers
